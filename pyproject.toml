[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stampfly-ecosystem"
version = "0.1.0"
description = "StampFly Flight Control Development Environment"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10,<3.13"
authors = [
    {name = "StampFly Team"}
]
keywords = ["drone", "quadcopter", "flight-control", "esp32"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy>=1.24.0,<2.3.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "pyserial>=3.5",
    # jinja2 lower bound relaxed to 3.0: see requirements.txt for the
    # ESP-IDF 5.5 constraint-file conflict this avoids (jinja2<3.1 on
    # Windows + Python<3.11), and why 3.0.x is safe here.
    # jinja2 の下限を3.0に緩和: 詳細は requirements.txt を参照
    # (ESP-IDF 5.5 の constraint ファイルとの衝突回避、3.0.xで問題ない理由)。
    "jinja2>=3.0",
    "websockets>=12.0",
    "PyYAML>=6.0",
    # HTTPS certificate bundle for sf flasher / the GUI flasher's GitHub
    # calls: macOS Pythons often lack usable OpenSSL default verify paths.
    # sf flasher / GUIフラッシャの GitHub 通信用 CA バンドル: macOS の
    # Python は OpenSSL の既定検証パスが使えないことが多い。
    "certifi>=2024.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
sim = [
    "vpython>=7.6.0",
    "pygame>=2.5.0",
    "numpy-stl>=3.0.0",
    "hid>=1.0.0",
]
pilot = [
    # `sf pilot`'s judging layer talks to the TypeSafe HTTP API directly
    # (see lib/sfpilot/judge.py for why not typesafe-sdk); httpx is what
    # keeps ONE connection alive across judgements, which matters because
    # a fresh TLS handshake costs about as much as a judgement itself.
    # Lower bound 0.27: published well over a day ago, per the install
    # policy of not taking a package the day it appears.
    # `sf pilot` の判断層は TypeSafe の HTTP API を直接呼ぶ
    # （typesafe-sdk を使わない理由は lib/sfpilot/judge.py 参照）。httpx は
    # 判断をまたいで接続を 1 本に保つために使う。TLS を張り直すと判断 1 回分
    # に近い時間がかかるため重要。下限 0.27 は公開から十分に日数が経った版
    # （公開当日のパッケージは入れないという方針）。
    "httpx>=0.27",
]
full = [
    "esptool>=4.6",
    "Pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "vpython>=7.6.0",
    "pygame>=2.5.0",
    "numpy-stl>=3.0.0",
]
[project.scripts]
sf = "sfcli.cli:main"

[project.urls]
Homepage = "https://github.com/stampfly/stampfly-ecosystem"
Documentation = "https://github.com/stampfly/stampfly-ecosystem/docs"
Repository = "https://github.com/stampfly/stampfly-ecosystem"

[tool.setuptools.packages.find]
where = ["lib"]

[tool.setuptools.package-dir]
"" = "lib"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
